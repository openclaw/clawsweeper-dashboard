name: dashboard

on:
  # Live dashboard is openclaw/clawsweeper-state; this dump must not cron-checkout state.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clawsweeper-state-dashboard
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Archive notice
        run: |
          echo "This repository is a frozen July 2026 dump."
          echo "Live dashboard rendering lives in openclaw/clawsweeper-state."
          echo "This workflow must not checkout the state branch or rewrite README.md."
